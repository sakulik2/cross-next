<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>cross-next</title>
<style>
  /* 配色由封面主色驱动：JS 只改 --a / --b 两个变量，其余全部由它们推导。 */
  :root {
    --a: #2a2a35;
    --b: #16161c;
    --fg: #f4f4f7;
    --dim: rgba(244,244,247,.62);
    --faint: rgba(244,244,247,.13);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px
             max(20px, env(safe-area-inset-bottom));
    font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    background: var(--b);
    overflow: hidden;
  }

  /* 背景渐变独立成层，这样换色时可以单独淡入淡出，不影响内容。 */
  .bg {
    position: fixed;
    inset: -20%;
    z-index: -1;
    background:
      radial-gradient(60% 60% at 30% 25%, var(--a), transparent 70%),
      radial-gradient(55% 55% at 75% 75%, var(--a), transparent 70%),
      var(--b);
    filter: saturate(1.5);
    transition: background 1.2s ease;
  }

  .card {
    width: min(100%, 380px);
    display: grid;
    gap: 22px;
    justify-items: center;
    text-align: center;
  }

  /* 封面。aspect-ratio 保证正方形，不必等图片加载就能占好位。 */
  .art {
    position: relative;
    width: min(74vw, 280px);
    aspect-ratio: 1;
    border-radius: 18px;
    overflow: hidden;
    background: var(--faint);
    box-shadow: 0 24px 60px -12px rgba(0,0,0,.7);
    transition: transform .45s cubic-bezier(.22,1,.36,1);
  }
  /* 暂停时封面缩一点，是"正在播放"最直观的视觉反馈。 */
  body:not(.playing) .art { transform: scale(.93); }

  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 无封面时的占位符 */
  .art::after {
    content: "♪";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 4rem;
    color: var(--faint);
    opacity: 0;
    transition: opacity .3s;
  }
  .art.empty::after { opacity: 1; }

  .meta { display: grid; gap: 6px; width: 100%; }

  .title {
    font-size: 1.28rem;
    font-weight: 600;
    letter-spacing: .01em;
    /* 长曲名截断而不是换行，避免布局跳动。 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist {
    color: var(--dim);
    font-size: .95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 进度条。hidden 属性由 JS 控制 —— 会话不上报时间轴时整块不占位。 */
  .seek { width: 100%; }
  .seek[hidden] { display: none; }

  .times {
    display: flex;
    justify-content: space-between;
    font-size: .74rem;
    color: var(--dim);
    /* 等宽数字，避免秒数变化时左右跳动 */
    font-variant-numeric: tabular-nums;
    margin-top: -2px;
  }

  /* 不可拖动时（应用不允许 seek）仍显示进度，只是不能操作 */
  #seekBar:disabled { cursor: default; }

  /* 三列：重播键 | 主传输键 | 模式开关。只有中列参与居中，所以 play 始终在
     卡片正中，两侧各放多少东西都不会把它推歪。 */
  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
  }

  .controls .main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  /* 重播键靠向主键组，做成小一号的 ghost 按钮 —— 它是辅助操作，
     不该和 prev/play/next 抢视觉重量。 */
  .controls .aux {
    justify-self: end;
    padding-right: 12px;
  }

  .aux button {
    width: 40px; height: 40px;
    background: none;
  }
  .aux button svg { width: 20px; height: 20px; }

  /* 模式开关在右列，与左列的重播键镜像对齐。 */
  .controls .mode {
    justify-self: start;
    padding-left: 12px;
  }

  /* 文字胶囊而非圆形，和图标键区分开：它切换状态，不执行动作。 */
  #mode {
    width: auto; height: 26px;
    padding: 0 10px;
    border-radius: 13px;
    background: var(--faint);
    font: inherit;
    font-size: .7rem;
    color: var(--dim);
    white-space: nowrap;
  }
  #mode[hidden] { display: none; }

  /* button 的 display:grid 会盖过 hidden 属性，必须显式关掉 ——
     和 .seek[hidden] 同一个原因。漏了这条按钮在 mediakey 模式下照样显示。 */
  #restart[hidden] { display: none; }

  button {
    border: 0;
    background: var(--faint);
    color: var(--fg);
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    /* 44px 是可点区域的下限，手机上按得准。 */
    width: 56px; height: 56px;
    transition: background .18s, transform .12s;
  }
  button:hover { background: rgba(244,244,247,.22); }
  button:active { transform: scale(.9); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  button[disabled] { opacity: .35; cursor: not-allowed; }

  /* 播放键做大，形成视觉重心 */
  #play { width: 72px; height: 72px; background: var(--fg); color: #111; }
  #play:hover { background: #fff; }

  button svg { width: 24px; height: 24px; fill: currentColor; }
  #play svg { width: 30px; height: 30px; }

  .vol {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    color: var(--dim);
  }
  .vol svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .vol button { width: 32px; height: 32px; background: none; }
  .vol button svg { width: 20px; height: 20px; }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 22px;
    background: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: var(--faint);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px; background: var(--faint);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--fg);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--fg);
  }
  input[type=range]:disabled { opacity: .35; cursor: not-allowed; }

  /* token 补填面板。只在服务端回 401 时出现。 */
  .auth { display: none; width: 100%; gap: 10px; flex-direction: column; }
  .auth:not([hidden]) { display: flex; }
  .authMsg { font-size: .82rem; color: var(--dim); }
  .auth input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid var(--faint);
    border-radius: 10px;
    background: rgba(0,0,0,.25);
    color: var(--fg);
    font: inherit;
    font-size: .88rem;
  }
  .auth input:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  /* 方形按钮，和控制区那些圆形的区分开 */
  .auth button {
    width: 100%; height: auto;
    padding: 10px;
    border-radius: 10px;
    font: inherit;
  }

  /* 状态条：只在有话要说时占位置 */
  .note {
    min-height: 1.2em;
    font-size: .8rem;
    color: var(--dim);
    transition: opacity .3s;
  }
  .note:empty { opacity: 0; }

  /* 无障碍：尊重系统的减少动态偏好 */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<main class="card">
  <div class="art empty" id="art">
    <img id="artImg" alt="" hidden>
  </div>

  <div class="meta">
    <div class="title" id="title">未连接</div>
    <div class="artist" id="artist"></div>
  </div>

  <div class="seek" id="seek" hidden>
    <input type="range" id="seekBar" min="0" max="1000" value="0" step="1"
           aria-label="播放进度">
    <div class="times">
      <span id="elapsed">0:00</span>
      <span id="total">0:00</span>
    </div>
  </div>

  <div class="controls">
    <!-- 重播。刻意不用「⏮带竖线」那种图标：小尺寸下和 prev 分不出来。 -->
    <div class="aux">
      <button id="restart" aria-label="重播" title="从头开始" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
    </div>
    <div class="main">
      <button id="prev" aria-label="上一首" title="上一首">
        <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm3 6 8.5 6V6z"/></svg>
      </button>
      <button id="play" aria-label="播放/暂停" title="播放/暂停">
        <svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" aria-label="下一首" title="下一首">
        <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 18l8.5-6L5 6z"/></svg>
      </button>
    </div>
    <!-- 重播的两种模式。刻意做成看得见的开关而不是长按/右键那类隐藏手势 ——
         这是个会被记住的偏好，不是一次性动作，藏起来只会没人知道它存在。 -->
    <div class="aux mode">
      <button id="mode" hidden></button>
    </div>
  </div>

  <div class="vol">
    <button id="mute" aria-label="静音" title="静音">
      <svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
    <input type="range" id="vol" min="0" max="100" value="0"
           aria-label="QQ音乐 音量" disabled>
  </div>

  <div class="note" id="note"></div>

  <!-- token 补填。默认隐藏，401 时出现 —— 否则每次换 token 都得回控制台复制链接。 -->
  <div class="auth" id="auth" hidden>
    <div class="authMsg" id="authMsg">token 无效</div>
    <input id="tokenInput" type="text" autocomplete="off" spellcheck="false"
           placeholder='粘贴 token，或整行 "token": "..."' aria-label="token">
    <button id="tokenSave">保存</button>
  </div>
</main>

<script>
"use strict";

// ---- token ----
// 首次从 URL 的 ?t= 取，随后存 localStorage 并把它从地址栏抹掉，
// 免得 token 留在浏览历史里。
const KEY = "cross-next-token";
const url = new URL(location.href);
const fromUrl = url.searchParams.get("t");
if (fromUrl) {
  localStorage.setItem(KEY, fromUrl);
  url.searchParams.delete("t");
  history.replaceState(null, "", url.pathname + url.hash);
}
// 不是 const：401 后可以就地补填，不必回控制台复制链接重开页面。
let token = localStorage.getItem(KEY) || "";

// 从用户粘贴的东西里取出 token。
//
// 目标是"怎么粘都行"：光秃秃的 token、config.json 里的整行
// `"token": "8ed9..."`、带尾逗号、甚至整段 JSON 或那条完整 URL。
// 用户手边最容易复制到的就是 config.json 里的那一行，要求他们手工剥引号
// 纯属没必要的刁难。
function parseToken(raw) {
  const text = (raw || "").trim();
  if (!text) return "";

  // 优先找 token 的键值写法，整段 JSON 粘进来也能命中。
  const keyed = text.match(/["']?token["']?\s*[:=]\s*["']?([A-Za-z0-9._\-]+)/i);
  if (keyed) return keyed[1];

  // 其次是带 ?t= 的完整 URL。
  const query = text.match(/[?&]t=([A-Za-z0-9._\-]+)/);
  if (query) return query[1];

  // 都不像，就当成裸 token；剥掉可能顺手带上的引号和逗号。
  return text.replace(/^["'\s]+|["',\s]+$/g, "");
}

const $ = (id) => document.getElementById(id);
const els = {
  bg: $("bg"), art: $("art"), artImg: $("artImg"),
  title: $("title"), artist: $("artist"), note: $("note"),
  play: $("play"), playIcon: $("playIcon"),
  prev: $("prev"), next: $("next"),
  restart: $("restart"), mode: $("mode"),
  vol: $("vol"), mute: $("mute"), volIcon: $("volIcon"),
  seek: $("seek"), seekBar: $("seekBar"),
  elapsed: $("elapsed"), total: $("total"),
  auth: $("auth"), authMsg: $("authMsg"),
  tokenInput: $("tokenInput"), tokenSave: $("tokenSave"),
};

const ICON = {
  play: "M8 5v14l11-7z",
  pause: "M6 5h4v14H6zm8 0h4v14h-4z",
  loud: "M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z",
  muted: "M3 9v6h4l5 5V4L7 9zm16 1.4L17.6 9 16 10.6 14.4 9 13 10.4 14.6 12 13 13.6 14.4 15 16 13.4 17.6 15 19 13.6 17.4 12z",
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + token },
  });
  if (res.status === 401) {
    // 不再让用户回控制台重开链接 —— 就地给个输入框。
    askForToken(token ? "token 无效或已更换" : "还没有 token");
    throw new Error("token 无效");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res;
}

// 亮出补填面板。已有 token 时预填，方便看出是哪里不对。
function askForToken(reason) {
  els.authMsg.textContent = reason + "：粘贴服务端 config.json 里的 token。";
  els.auth.hidden = false;
  if (token && !els.tokenInput.value) els.tokenInput.value = token;
}

// ---- 封面取色 ----
// 把封面缩到 16x16 再统计，够准且开销可忽略。跳过接近黑白的像素，
// 否则大面积深色背景的封面会算出一团灰，失去"跟着歌变脸"的效果。
function pickColors(img) {
  const N = 16;
  const cv = document.createElement("canvas");
  cv.width = cv.height = N;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, N, N);

  let data;
  try {
    data = ctx.getImageData(0, 0, N, N).data;
  } catch {
    return null; // 理论上同源不会污染画布，保险起见兜一下
  }

  const buckets = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    // 饱和度太低或明度过暗/过亮的像素不参与投票
    if (max - min < 28 || max < 45 || min > 225) continue;
    // 量化到 32 级，让相近颜色归到一个桶
    const key = (r >> 5) * 64 + (g >> 5) * 8 + (b >> 5);
    const acc = buckets.get(key) || [0, 0, 0, 0];
    buckets.set(key, [acc[0] + r, acc[1] + g, acc[2] + b, acc[3] + 1]);
  }

  if (!buckets.size) return null;

  const top = [...buckets.values()].sort((x, y) => y[3] - x[3])[0];
  const [r, g, b] = [top[0] / top[3], top[1] / top[3], top[2] / top[3]];

  // 主色调暗一档做渐变亮部，再压得更暗做底色，保证文字对比度始终够。
  const mix = (v, t, k) => Math.round(v * (1 - k) + t * k);
  return {
    a: `rgb(${mix(r, 0, .18)},${mix(g, 0, .18)},${mix(b, 0, .18)})`,
    b: `rgb(${mix(r, 8, .84)},${mix(g, 8, .84)},${mix(b, 10, .84)})`,
  };
}

function applyColors(c) {
  const root = document.documentElement.style;
  root.setProperty("--a", c ? c.a : "#2a2a35");
  root.setProperty("--b", c ? c.b : "#16161c");
  document.querySelector('meta[name=theme-color]')
    .setAttribute("content", c ? c.b : "#101014");
}

// ---- 状态同步 ----
let lastTag = null;      // 已加载的封面标识，变了才重取图
let pending = 0;         // 乐观更新后的宽限期，避免被旧快照回滚
let volDragging = false; // 拖动音量时不让轮询覆盖滑杆位置
let muted = false;       // 服务端报告的静音状态，静音键据此取反
let artEtag = null;      // 已显示封面的内容哈希，用于判断图是否真的换了
// 进度条状态。服务端每秒给一个已外推的 position，两次之间由本地时钟插值补平，
// 否则进度条会一秒一跳。seekDragging 期间完全交给用户，不被轮询覆盖。
let seekDragging = false;
let track = null; // { position, duration, playing, at } —— at 是收到该值时的本地时刻

// 重播模式。restart 只跳回起点，replay 跳回后顺带播放。
//
// 两种都有人要，差别只在暂停时按下去：restart 保持暂停（"退回开头待命"），
// replay 直接出声（"再听一遍"）。播放中两者等价。存 localStorage ——
// 这是个偏好，不该每次开页面都重选。
const MODE_KEY = "cross-next-replay-mode";
let replayMode = localStorage.getItem(MODE_KEY) === "replay" ? "replay" : "restart";

// 开关上的字说的是**当前**模式，不是点下去会变成什么 —— 后者每次都得在脑子里
// 取反一遍。点击的后果写在 title 里。
function renderMode() {
  const isReplay = replayMode === "replay";
  els.mode.textContent = isReplay ? "重播并播放" : "仅回开头";
  els.mode.title = isReplay
    ? "当前：跳回开头并开始播放。点击改为仅回到开头（暂停时保持暂停）"
    : "当前：仅跳回开头，暂停时保持暂停。点击改为跳回后自动播放";
}
renderMode();

// 重播键和它的模式开关同进同退 —— 开关单独留着没有意义。
function showRestart(on) {
  els.restart.hidden = !on;
  els.mode.hidden = !on;
}

// volume 为 null 表示 QQ音乐 当前没有音频会话（没出声）。
function renderVolume(s) {
  const hasVol = s.volume !== null && s.volume !== undefined;
  els.vol.disabled = !hasVol;
  els.mute.disabled = !hasVol;
  if (hasVol && !volDragging) els.vol.value = Math.round(s.volume * 100);
  muted = !!s.muted;
  els.volIcon.setAttribute("d", muted ? ICON.muted : ICON.loud);
  return hasVol;
}

/// 秒 -> m:ss
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

// 记下服务端给的时间轴。position 已由服务端按 LastUpdatedTime 外推，
// 这里再记一个本地时刻，用于两次轮询之间的插值。
function renderSeek(s) {
  const has = s.position !== null && s.position !== undefined
           && s.duration !== null && s.duration !== undefined && s.duration > 0;

  els.seek.hidden = !has;
  if (!has) { track = null; return; }

  track = { position: s.position, duration: s.duration, playing: !!s.playing, at: performance.now() };
  // 刻意不按 canSeek 禁用滑杆。QQ音乐 上报的能力位不可信 —— 实测它报
  // IsPlaybackPositionEnabled=false，而 TryChangePlaybackPositionAsync 照样
  // 返回 accepted=true 并真的跳了过去。照能力位禁用等于白白废掉一个能用的功能。
  // 和播放键同一套做法：命令照发，应用拒绝就如实报出来。
  els.total.textContent = fmtTime(s.duration);
  paint();
}

// 每帧按本地时钟把进度往前推。只有播放中才推进；拖动时完全不动，
// 免得和用户的手指打架。
function paint() {
  if (!track || seekDragging) return;

  const drift = track.playing ? (performance.now() - track.at) / 1000 : 0;
  const pos = Math.min(track.position + drift, track.duration);

  els.seekBar.value = Math.round((pos / track.duration) * 1000);
  els.elapsed.textContent = fmtTime(pos);
}

function tick() {
  paint();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// 当前正被 <img> 使用的 blob URL。createObjectURL 建立的映射要显式释放，
// 否则每次换歌泄漏一张图，挂一整天会积起可观的内存。
let artUrl = null;

// 释放上一张图的 blob URL。必须在新 URL 已经装上之后才调 ——
// 提前释放会让 <img> 指向一个失效的 URL。
function releaseArtUrl(url) {
  if (url) URL.revokeObjectURL(url);
}

// 取封面。服务端的 ETag 是图片内容哈希，只有真的换了图才重绘。
async function loadArt() {
  try {
    const res = await api("/api/thumbnail");
    const etag = res.headers.get("ETag");
    if (etag && etag === artEtag) return; // 同一张图，不必重绘
    const blob = await res.blob();
    if (!blob.size) throw new Error("空封面");

    // 走 fetch 是为了带上 Authorization 头，<img src> 没法带。
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      artEtag = etag;
      els.artImg.src = url;
      els.artImg.hidden = false;
      els.art.classList.remove("empty");
      applyColors(pickColors(img));
      // 换上新图之后再放掉旧的。
      const stale = artUrl;
      artUrl = url;
      releaseArtUrl(stale);
    };
    // 解码失败时这张图不会被用到，立刻放掉，别等下一次换歌。
    img.onerror = () => { releaseArtUrl(url); };
    img.src = url;
  } catch {
    artEtag = null;
    els.artImg.hidden = true;
    els.art.classList.add("empty");
    applyColors(null);
  }
}

function render(s) {
  if (s.error) { els.note.textContent = s.error; return; }

  if (!s.present) {
    els.title.textContent = "QQ音乐 未在播放";
    els.artist.textContent = "";
    els.note.textContent = "打开 QQ音乐 并播放任意歌曲";
    els.art.classList.add("empty");
    els.artImg.hidden = true;
    els.seek.hidden = true;
    showRestart(false);
    document.body.classList.remove("playing");
    lastTag = null;
    artEtag = null;
    track = null;
    applyColors(null);
    return;
  }

  // mediakey 模式：QQ音乐 没注册 SMTC，只能发全局媒体键，读不到任何元数据。
  // 按键仍然有效，所以不该显示成"未连接"，而是明确说明当前的能力边界。
  if (s.mode === "mediakey") {
    els.title.textContent = "QQ音乐 正在播放";
    els.artist.textContent = "此版本不提供曲目信息";
    els.art.classList.add("empty");
    els.artImg.hidden = true;
    document.body.classList.add("playing");
    els.seek.hidden = true;
    // mediakey 模式没有 SMTC 会话，定位无从下手。和进度条一样整块藏掉，
    // 而不是留个按下去必然报错的按钮。
    showRestart(false);
    lastTag = null;
    artEtag = null;
    track = null;
    applyColors(null);
    renderVolume(s);
    els.note.textContent = "媒体键模式：按键是全局的，若有其它播放器在放可能被抢走";
    return;
  }

  els.title.textContent = s.title || "未知曲目";
  els.artist.textContent = [s.artist, s.album].filter(Boolean).join(" · ");

  // 乐观更新的宽限期内不接受服务端的播放状态，否则点下去会闪回。
  if (!pending) {
    document.body.classList.toggle("playing", s.playing);
    els.playIcon.setAttribute("d", s.playing ? ICON.pause : ICON.play);
  }

  if (s.artTag && s.artTag !== lastTag) {
    lastTag = s.artTag;
    loadArt();
    // SMTC 的缩略图有时比曲目元数据慢一拍，换歌瞬间取到的可能还是上一首的图。
    // 过一会儿再核对一次，内容哈希没变就什么都不做。
    setTimeout(loadArt, 1200);
    setTimeout(loadArt, 3000);
  }

  renderSeek(s);
  // smtc 模式一律显示。刻意不看 canSeek —— 和进度条同一个理由：QQ音乐 上报
  // IsPlaybackPositionEnabled=false 却真的能跳，照能力位藏起来等于白废一个能用的功能。
  showRestart(true);
  const hasVol = renderVolume(s);

  const notes = [];
  if (!s.matched) notes.push("未锁定到 QQ音乐，当前控制的是：" + s.aumid);
  if (!hasVol) notes.push("音量暂不可用（QQ音乐 未输出声音）");
  els.note.textContent = notes.join("；");
}

async function poll() {
  try {
    const s = await (await api("/api/state")).json();
    render(s);
  } catch (e) {
    els.note.textContent = e.message;
  }
}

// ---- 操作 ----
// 乐观更新：立刻改 UI，不等往返。局域网虽快，但一个来回的迟滞是能感觉到的。
async function send(action) {
  if (action === "playpause") {
    const playing = !document.body.classList.contains("playing");
    document.body.classList.toggle("playing", playing);
    els.playIcon.setAttribute("d", playing ? ICON.pause : ICON.play);
    pending++;
    setTimeout(() => { pending--; }, 1200);
  }

  try {
    const r = await (await api("/api/cmd", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action }),
    })).json();

    // accepted=false 是 QQ音乐 拒绝了命令，如实说，不假装成功。
    els.note.textContent = r.error ? r.error
      : (r.accepted === false ? "QQ音乐 未接受这个操作" : "");
    // 切歌后尽快刷新，别等下一个轮询周期。QQ音乐 更新 SMTC 元数据要些时间，
    // 所以补几次而不是只查一次。
    if (action !== "playpause") {
      [200, 600, 1400].forEach((ms) => setTimeout(poll, ms));
    }
  } catch (e) {
    els.note.textContent = e.message;
  }
}

async function setVolume(level) {
  try {
    await api("/api/volume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level }),
    });
  } catch (e) {
    els.note.textContent = e.message;
  }
}

// 重播。乐观地把进度归零，不等最多一秒的轮询 —— 这个按钮的全部价值就在即时反馈。
els.restart.onclick = () => {
  if (track) {
    track = { ...track, position: 0, at: performance.now() };
    // replay 模式下顺带乐观地转成播放态，和 send("playpause") 同一套做法。
    if (replayMode === "replay" && !track.playing) {
      track = { ...track, playing: true };
      document.body.classList.add("playing");
      els.playIcon.setAttribute("d", ICON.pause);
      pending++;
      setTimeout(() => { pending--; }, 1200);
    }
    paint();
  }
  send(replayMode);
};

els.mode.onclick = () => {
  replayMode = replayMode === "replay" ? "restart" : "replay";
  localStorage.setItem(MODE_KEY, replayMode);
  renderMode();
};

els.prev.onclick = () => send("prev");
els.next.onclick = () => send("next");
els.play.onclick = () => send("playpause");

els.mute.onclick = async () => {
  // 对服务端报告的状态取反，而不是从图标反推 —— 后者在首次渲染前读不到值。
  const want = !muted;
  muted = want;
  els.volIcon.setAttribute("d", want ? ICON.muted : ICON.loud);
  try {
    await api("/api/volume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mute: want }),
    });
  } catch (e) {
    els.note.textContent = e.message;
  }
};

// 拖动时节流发送，松手后补一次终值，避免中途丢最后一个位置。
let volTimer = null;
els.vol.addEventListener("input", () => {
  volDragging = true;
  if (volTimer) return;
  volTimer = setTimeout(() => {
    volTimer = null;
    setVolume(els.vol.value / 100);
  }, 120);
});
els.vol.addEventListener("change", () => {
  volDragging = false;
  setVolume(els.vol.value / 100);
});

// 拖动进度：按下即接管显示，松手才发命令。拖动过程中不发 —— 一次 seek
// 就够了，中途连发会让播放器来回跳。
els.seekBar.addEventListener("pointerdown", () => { seekDragging = true; });

// 松手必须无条件解除接管。只靠 change 事件解除是不够的：原地点一下不改变值时
// change 根本不触发，seekDragging 就永久卡在 true，paint() 从此直接返回 ——
// 进度条冻结在按下那一刻，而 total 仍随轮询更新，于是出现 3:41/2:01 这种
// 已经换了歌、前半截还是上一首进度的画面。
//
// 延迟一拍是给 change 让路：range 的 change 紧跟 pointerup，它会把 track
// 乐观更新到新位置。这里先清标志的话，中间那一帧会用旧位置重绘，看着像回跳。
addEventListener("pointerup", () => {
  if (seekDragging) setTimeout(() => { seekDragging = false; }, 150);
});
addEventListener("pointercancel", () => { seekDragging = false; });

els.seekBar.addEventListener("input", () => {
  if (!track) return;
  // 拖动时实时更新时间文字，让用户看到目标位置。
  els.elapsed.textContent = fmtTime((els.seekBar.value / 1000) * track.duration);
});

els.seekBar.addEventListener("change", async () => {
  if (!track) { seekDragging = false; return; }
  const position = (els.seekBar.value / 1000) * track.duration;
  // 乐观更新：立刻以新位置为基准，不等服务端确认。
  track = { ...track, position, at: performance.now() };
  seekDragging = false;

  try {
    const r = await (await api("/api/cmd", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "seek", position }),
    })).json();
    els.note.textContent = r.error ? r.error
      : (r.accepted === false ? "QQ音乐 未接受拖动定位" : "");
  } catch (e) {
    els.note.textContent = e.message;
  }
  // 拉一次真值纠偏。
  setTimeout(poll, 400);
});

// 保存补填的 token。先试一次请求再落盘，免得把错的存进去、下次打开还是坏的。
async function saveToken() {
  const next = parseToken(els.tokenInput.value);
  if (!next) { els.authMsg.textContent = "没认出 token。"; return; }

  els.tokenSave.disabled = true;
  const previous = token;
  token = next; // api() 读的是这个变量，先换上才能验证
  try {
    const res = await fetch("/api/state", {
      headers: { Authorization: "Bearer " + next },
    });
    if (res.status === 401) {
      token = previous; // 验不过就还原，别覆盖掉原先可能还有用的那个
      els.authMsg.textContent = "这个 token 服务端不认，再核对一次。";
      return;
    }
    if (!res.ok) { token = previous; els.authMsg.textContent = "HTTP " + res.status; return; }

    localStorage.setItem(KEY, next);
    els.auth.hidden = true;
    els.tokenInput.value = "";
    els.note.textContent = "";
    render(await res.json());
  } catch (e) {
    token = previous;
    els.authMsg.textContent = e.message;
  } finally {
    els.tokenSave.disabled = false;
  }
}

els.tokenSave.onclick = saveToken;
// 回车即保存，粘贴完不用再找按钮。
els.tokenInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); saveToken(); }
});

// 键盘快捷键：桌面上用起来顺手
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  // Home 走按钮那条路（带乐观更新），且要跟着当前模式走 ——
  // 直接 send("restart") 会绕开两者。
  if (e.key === "Home") {
    e.preventDefault();
    if (!els.restart.hidden) els.restart.onclick();
    return;
  }
  const map = { ArrowLeft: "prev", ArrowRight: "next", " ": "playpause" };
  const action = map[e.key];
  if (action) { e.preventDefault(); send(action); }
});

poll();
setInterval(poll, 1000);
// 标签页切回前台时立刻刷新，不等轮询周期。
addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
